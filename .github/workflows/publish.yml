name: Prepare and publish FastNSA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastnsa-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'fastnsa/FastNSA'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version and release notes
        id: version
        run: python tools/ci/release.py version --github-output "$GITHUB_OUTPUT"
      - name: Require release commits to be on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  checks:
    needs: preflight
    uses: ./.github/workflows/multiplatform.yml
    permissions:
      contents: read

  sdist:
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-package tools
        run: python -m pip install build "twine>=6.1,<7"
      - name: Build and check source distribution
        run: |
          python -m build --sdist --outdir source-dist
          python -m twine check --strict source-dist/*.tar.gz
      - name: Build a smoke-test wheel from the source archive
        run: python -m pip wheel --no-deps --wheel-dir sdist-check source-dist/*.tar.gz
      - name: Test source-archive runtime in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-runtime"
          "$RUNNER_TEMP/sdist-runtime/bin/python" -m pip install "numpy==1.26.4" sdist-check/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-runtime/bin/python" -I -m fastnsa._selftest
      - uses: actions/upload-artifact@v4
        with:
          name: fastnsa-sdist
          path: source-dist/*.tar.gz
          if-no-files-found: error

  assemble:
    needs: [preflight, checks, sdist]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install "packaging>=24.2" "twine>=6.1,<7"
      - uses: actions/download-artifact@v4
        with:
          pattern: fastnsa-wheel-*
          path: staging/wheels
      - uses: actions/download-artifact@v4
        with:
          name: fastnsa-sdist
          path: staging/sdist
      - name: Assemble exact-version platform distributions
        run: >-
          python tools/ci/release.py assemble
          --artifacts staging --output release
          --commit "$GITHUB_SHA" --ref "$GITHUB_REF"
      - name: Validate PyPI metadata and description
        run: python -m twine check --strict release/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: fastnsa-release-${{ needs.preflight.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: >-
      github.repository == 'fastnsa/FastNSA' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, assemble]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fastnsa
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fastnsa-release-${{ needs.preflight.outputs.version }}
          path: release
      - name: Verify approved artifact handoff
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python tools/ci/release.py verify --bundle release
          --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --ref "$GITHUB_REF"
      - name: Refuse an existing PyPI release
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: python tools/ci/release.py check-index --version "$RELEASE_VERSION"
      - name: Publish approved distributions through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: release/dist/
          skip-existing: false

  github-release:
    if: >-
      github.repository == 'fastnsa/FastNSA' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fastnsa-release-${{ needs.preflight.outputs.version }}
          path: release
      - name: Verify release assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python tools/ci/release.py verify --bundle release
          --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --ref "$GITHUB_REF"
      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" release/dist/*
          release/SHA256SUMS release/manifest.json
          --verify-tag --draft --title "FastNSA $RELEASE_VERSION"
          --notes-file release/RELEASE_NOTES.md
