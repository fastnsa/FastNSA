[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastnsa"
version = "0.1.0"
requires-python = ">=3.9"
description = "Fast Network Spatial Analysis"

license = { text = "LGPL-3.0-only" }

authors = [
    { name = "FastNSA Project" }
]
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "osmnx",
    "shapely"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastnsa*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
fastnsa = [
    "bindings/*.so",
    "bindings/*.pyd",
    "bindings/*.dll",
    "bindings/*.dylib"
]